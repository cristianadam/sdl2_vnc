name: Build sdl2_vnc

on: [push]

env:
  PROJECT_NAME: sdl2_vnc
  MACOS_DEPLOYMENT_TARGET: "11.0"
  CMAKE_VERSION: "3.29.6"
  NINJA_VERSION: "1.12.1"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    outputs:
        tag: ${{ steps.git.outputs.tag }}
    strategy:
      matrix:
        config:
        - {
            name: "Windows Latest MSVC", artifact: "Windows-x64",
            os: windows-latest,
            platform: windows_x64,
            cc: "cl", cxx: "cl",
            environment_script: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat",
            vcpkg_target_triplet: "x64-windows-static"
          }
        - {
            name: "Windows Latest MSVC Arm64", artifact: "Windows-arm64",
            os: windows-latest,
            platform: windows_arm64,
            cc: "cl", cxx: "cl",
            environment_script: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvarsamd64_arm64.bat",
            vcpkg_target_triplet: "arm64-windows-static"
          }
        - {
            name: "Ubuntu Latest GCC", artifact: "Linux-x64",
            os: ubuntu-latest,
            platform: linux_x64,
            cc: "gcc", cxx: "g++",
            vcpkg_target_triplet: "x64-linux"
          }
        - {
            name: "Ubuntu Latest GCC Arm64", artifact: "Linux-arm64",
            os: ubuntu-24.04-arm,
            platform: linux_arm64,
            cc: "gcc", cxx: "g++",
            vcpkg_target_triplet: "arm64-linux"
          }
        - {
            name: "macOS Latest Clang", artifact: "macOS-x64",
            os: macos-latest,
            platform: mac_x64,
            cc: "clang", cxx: "clang++",
            vcpkg_target_triplet: "x64-osx"
          }
        - {
            name: "macOS Latest Clang Arm64", artifact: "macOS-arm64",
            os: macos-latest,
            platform: mac_arm64,
            cc: "clang", cxx: "clang++",
            vcpkg_target_triplet: "arm64-osx"
          }

    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      id: git
      shell: cmake -P {0}
      run: |
        if (${{github.ref}} MATCHES "tags/v(.*)")
            file(APPEND "$ENV{GITHUB_OUTPUT}" "tag=${CMAKE_MATCH_1}")
        else()
            file(APPEND "$ENV{GITHUB_OUTPUT}" "tag=${{github.run_id}}")
        endif()

    - name: Download Ninja and CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: ${{ env.CMAKE_VERSION }}
        ninjaVersion: ${{ env.NINJA_VERSION }}

    - name: Install system libs
      shell: cmake -P {0}
      run: |
        if ("${{ matrix.config.platform }}" MATCHES "linux")
          execute_process(
            COMMAND sudo apt-get update
          )
          execute_process(
            COMMAND sudo apt-get install -y libgl1-mesa-dev libltdl-dev libx11-dev libxft-dev libxext-dev
                 libwayland-dev libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev m4 autoconf automake libtool
            RESULT_VARIABLE result
          )
          if (NOT result EQUAL 0)
            message(FATAL_ERROR "Failed to install dependencies")
          endif()
        endif()

    - name: Set up vcpkg
      shell: cmake -P {0}
      run: |
        execute_process(COMMAND git clone https://github.com/microsoft/vcpkg.git)

        if (NOT "${{ runner.os }}" STREQUAL "Windows")
          execute_process(COMMAND bootstrap-vcpkg.sh WORKING_DIRECTORY vcpkg)
        else()
          execute_process(COMMAND bootstrap-vcpkg.bat WORKING_DIRECTORY vcpkg)
        endif()

        # Add to PATH environment variable
        file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}/vcpkg" vcpkg_dir)
        file(APPEND "$ENV{GITHUB_PATH}" "{vcpkg_dir}")


    - name: Install vcpkg dependencies
      shell: cmake -P {0}
      run: |
        execute_process(COMMAND vcpkg install --triplet ${{ matrix.config.vcpkg_target_triplet }})

    - name: Build
      shell: cmake -P {0}
      run: |
        set(ENV{CC} ${{ matrix.config.cc }})
        set(ENV{CXX} ${{ matrix.config.cxx }})
        set(ENV{MACOSX_DEPLOYMENT_TARGET} "${{ env.MACOS_DEPLOYMENT_TARGET }}")

        if ("${{ runner.os }}" STREQUAL "Windows" AND NOT "x${{ matrix.config.environment_script }}" STREQUAL "x")
          execute_process(
            COMMAND "${{ matrix.config.environment_script }}" && set
            OUTPUT_FILE environment_script_output.txt
          )
          file(STRINGS environment_script_output.txt output_lines)
          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()


        set(ENV{NINJA_STATUS} "[%f/%t %o/sec] ")

        if ("${{ matrix.config.platform }}" STREQUAL "mac_arm64")
            set(ENV{CMAKE_OSX_ARCHITECTURES} "arm64")
        else()
            set(ENV{CMAKE_OSX_ARCHITECTURES} "x86_64")
        endif()

        execute_process(
          COMMAND cmake
            -S .
            -B build
            -D CMAKE_BUILD_TYPE=Release
            -G Ninja
            -D CMAKE_MAKE_PROGRAM=ninja
            -D CMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake
            -D VCPKG_TARGET_TRIPLET=${{ matrix.config.vcpkg_target_triplet }}
          RESULT_VARIABLE result
        )
        if (NOT result EQUAL 0)
          string(REGEX MATCH "FAILED:.*$" error_message "${output}")
          string(REPLACE "\n" "%0A" error_message "${error_message}")
          message("::error::${error_message}")
          message(FATAL_ERROR "Build failed")
        endif()

        execute_process(
          COMMAND cmake --build build
          RESULT_VARIABLE result
          OUTPUT_VARIABLE output
          ERROR_VARIABLE output
          ECHO_OUTPUT_VARIABLE ECHO_ERROR_VARIABLE
        )
        if (NOT result EQUAL 0)
          string(REGEX MATCH "FAILED:.*$" error_message "${output}")
          string(REPLACE "\n" "%0A" error_message "${error_message}")
          message("::error::${error_message}")
          message(FATAL_ERROR "Build failed")
        endif()

    - name: Pack
      working-directory: build
      shell: cmake -P {0}
      run: |
        find_program(sdl2_vnc sdl2_vnc PATHS . NO_DEFAULT_PATH)
        execute_process(
            COMMAND ${CMAKE_COMMAND} -E tar cfv ../${{ env.PROJECT_NAME }}-${{ steps.git.outputs.tag }}-${{ matrix.config.artifact }}.7z
                    --format=7zip ${sdl2_vnc}
        )

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        path: ./${{ env.PROJECT_NAME }}-${{ steps.git.outputs.tag }}-${{ matrix.config.artifact }}.7z
        name: ${{ env.PROJECT_NAME }}-${{ steps.git.outputs.tag }}-${{ matrix.config.artifact }}.7z

  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-with-dirs

    - name: Fixup artifacts
      run: |
        mkdir release
        mv release-with-dirs/*/* release/

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.build.outputs.tag }}
        files: release/*
        draft: false
        prerelease: false
